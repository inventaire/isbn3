<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISBN Parser</title>
  <style>
    body {
      margin: 1rem;
      font-family: sans-serif;
    }
    #title {
      font-size: x-large;
      margin: 1rem 0;
    }
    #intro {
      color: #444;
    }
    .control {
      margin: 1rem 0;
    }
    pre:not(:empty) {
      background-color: #eee;
      white-space: pre-wrap;
    }
    pre:not(:empty):not(.inline) {
      padding: 1em;
      max-width: 30em;
      margin: 1em 0;
    }
    .no-js {
      color: red;
      padding: 1em;
      background-color: #ccc;
    }
    pre.inline {
      display: inline;
      padding: 0.2rem;
    }
  </style>
</head>
<body>
  <div id="title">ISBN Parser</div>

  <p id="intro">This is a demo of what the <a href="https://github.com/inventaire/isbn3">isbn3</a> JS module can deduce from an <a href="https://en.wikipedia.org/wiki/International_Standard_Book_Number">ISBN</a></p>

  <div class="control">
    ISBN: <input id="isbnInput" type="text" value="9781781682135" />
  </div>

  <strong>
    <a href="https://github.com/inventaire/isbn3#parse"><pre class="inline">ISBN.parse</pre></a>
    result:
  </strong>
  <pre id="result"></pre>

  <strong>
    <a href="https://github.com/inventaire/isbn3#audit"><pre class="inline">ISBN.audit</pre></a>
    result:
  </strong>
  <pre id="audit"></pre>

  <noscript>
    <p class="no-js">This demo requires javascript</p>
  </noscript>

  <script type="module">
    // isbn3 is an ESM-only package: load it directly from a CDN as an ES module.
    import ISBN from 'https://cdn.jsdelivr.net/npm/isbn3@3/+esm'

    const isbnInput = document.getElementById('isbnInput')
    const resultEl = document.getElementById('result')
    const auditEl = document.getElementById('audit')

    const queryIsbn = new URLSearchParams(window.location.search).get('isbn')
    if (queryIsbn) isbnInput.value = queryIsbn

    let lastValue

    const updateQueryString = isbn => {
      window.history.pushState({ isbn }, isbn, `?isbn=${isbn}`)
    }

    const update = () => {
      const currentValue = isbnInput.value.trim()
      if (currentValue === lastValue) return
      lastValue = currentValue

      if (currentValue === '') {
        resultEl.textContent = 'Missing ISBN'
        auditEl.textContent = 'Missing ISBN'
        return
      }

      const isbnData = ISBN.parse(currentValue)
      resultEl.textContent = isbnData ? JSON.stringify(isbnData, null, 2) : 'invalid ISBN'
      auditEl.textContent = JSON.stringify(ISBN.audit(currentValue), null, 2)
      updateQueryString(currentValue)
    }

    const debounce = (func, wait) => {
      let timeout
      return (...args) => {
        clearTimeout(timeout)
        timeout = setTimeout(() => func(...args), wait)
      }
    }

    // Restore the ISBN from a History event
    // cf https://developer.mozilla.org/en-US/docs/Web/API/History_API
    window.addEventListener('popstate', ({ state }) => {
      if (state?.isbn) isbnInput.value = state.isbn
    })

    update()
    isbnInput.addEventListener('keyup', debounce(update, 100))
  </script>
</body>
</html>
